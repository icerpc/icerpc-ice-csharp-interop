name: ci

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run every day at 6:00 UTC
    - cron: "00 6 * * *"

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: 🔨 Build Tests
        run: dotnet build

      - name: 🧪 Test .NET
        run: |
          mkdir -p TestResults
          dotnet test \
            --no-build \
            --verbosity normal \
            --blame \
            --blame-crash \
            --blame-hang-timeout 60s \
            --diag:"TestResults/vstest.log" \
            --logger "trx" \
            --results-directory TestResults
        shell: bash

      - name: Install dotnet-trx tool
        run: dotnet tool install -g dotnet-trx
        shell: bash
        if: always()

      - name: Create test report
        run: trx --path TestResults
        shell: bash
        if: always()

      - name: Upload blame dumps and logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: blame-and-dumps-${{ runner.os }}
          path: |
            TestResults/**/*.dmp
            TestResults/**/*.xml
            TestResults/**/*.txt
            TestResults/**/*.log
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
        if: always()
